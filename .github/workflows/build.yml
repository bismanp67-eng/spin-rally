name: build
on: push
env:
  GODOT_VERSION: 4.7.2
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          [ -d ~/.config/godot ] || cp -r /root/.config/godot ~/.config/godot || true
          [ -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] || cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
      - name: Import
        run: godot --headless --import || true
      - name: Tests
        run: |
          if [ -f tests/run_tests.gd ]; then godot --headless -s tests/run_tests.gd; fi
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/SpinRally.apk
          ls -la build
          test -s build/SpinRally.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpinRally-apk
          path: build/SpinRally.apk
