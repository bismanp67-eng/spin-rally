name: build
on: push
env:
  GODOT_VERSION: 4.7.2
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          [ -d ~/.config/godot ] || cp -r /root/.config/godot ~/.config/godot || true
          [ -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] || cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          [ -f /root/debug.keystore ] || keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
      - name: Pin signing key
        # One fixed debug keystore lives in the repo (personal use only) so every APK installs over the last.
        run: |
          git config --global --add safe.directory "$PWD"
          if [ ! -f ci/debug.keystore ]; then
            mkdir -p ci && cp /root/debug.keystore ci/debug.keystore
            git config user.name "spin-rally-ci" && git config user.email "ci@users.noreply.github.com"
            git add -f ci/debug.keystore && git commit -m "CI: pin debug keystore" && git push origin HEAD:refs/heads/${GITHUB_REF_NAME} || echo "PIN_PUSH_FAILED"
          fi
      - name: Import
        run: godot --headless --import || true
      - name: Tests
        run: |
          if [ -f tests/run_tests.gd ]; then godot --headless -s tests/run_tests.gd; fi
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/ci/debug.keystore"
          godot --headless --export-debug "Android" build/SpinRally.apk
          ls -la build
          test -s build/SpinRally.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpinRally-apk
          path: build/SpinRally.apk
      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Spin Rally (latest build)
          body: Tap SpinRally.apk below to download, then open it to install.
          files: build/SpinRally.apk
